# どこから何を引くか。ここだけが手で書く一枚で、site はここから生成する。
#
# 拾うのは **散文**(.md / .mdx)だけ。画像は本文が参照しているものを写す(直感的に
# 掴む助けになるなら載せる)。各 repo は自分の `.docs.toml` で「隠す / 並び / 説明」を
# 上書きできる ── 主導権は書いた側にある。
#
# private の repo は `private = true`。引くのに `DOCS_TOKEN`(Actions の secret)が要り、
# 無ければ黙って飛ばす(公開の面を壊さない)。
#
# include は「これに当たるものを拾う」、exclude は「これを外す」。node_modules / dist /
# _build / _stage / vendor / .git は、書かなくても常に外れる。

[[source]]
org = "f3liz-casa"
repo = "noraneko-registry"
ref = "main"
title = "noraneko registry"
description = "drop(コードで降ってくる機能)の台帳。表(ABI)・殻・build の作法"
order = 10
include = ["README.md", "docs/**/*.md", "abi/v1.json"]


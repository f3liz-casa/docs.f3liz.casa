# `.mdoc` の記事。`strip` で URL を短く、route を記事の道に合わせるので、本文の
# `/ja/slug/` のような root 相対の内部リンクが、そのまま site の URL に届く。
[[source]]
org = "f3liz-casa"
repo = "atfedi-de"
ref = "main"
title = "atfedi-de blog"
description = "sukhi-fedi のことなど、書いたもの"
order = 110
strip = "blog/src/content/posts/"
include = ["blog/src/content/posts/**/*.mdoc"]


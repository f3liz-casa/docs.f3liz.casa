# 引いて、組んで、配る。これ一つ。
#
#   手で:   gh workflow run sync.yml -R f3liz-casa/docs.f3liz.casa
#           gh run watch -R f3liz-casa/docs.f3liz.casa
#   source の push から: その repo の workflow に一行
#           gh api repos/f3liz-casa/docs.f3liz.casa/dispatches \
#             -f event_type=docs -f client_payload[repo]=<repo>
#           (下の repository_dispatch が受ける)
#   夜も一度(schedule)。取りこぼしは翌朝、勝手に直る。
#
# private の repo は org の **GitHub App** で引く ── その場かぎりの installation
# token を一個作る。人の PAT は要らず、期限も自動で切れる。名指しした repo しか
# 見えない token なので、build は private のときだけ載せる(public は未認証で読める)。
# secret は DOCS_APP_CLIENT_ID と DOCS_APP_PRIVATE_KEY。無ければ private を飛ばして、
# 公開の面だけを配る。
name: sync
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 03:00 JST
  repository_dispatch:
    types: [docs]
  push:
    branches: [main]
    paths: ["sources.toml", "scripts/**", "templates/**", "theme/**", "wrangler.toml", ".github/workflows/sync.yml"]

concurrency:
  group: sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: npm ci --silent || npm install --silent

      # private(memo / kotoba-cms)を読む鍵。短命で、その二つにだけ効く。
      - name: App のトークン
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: f3liz-casa
          repositories: memo,kotoba-cms
          permission-contents: read

      - name: 引いて、組む
        env:
          DOCS_TOKEN: ${{ steps.app.outputs.token }}
          DOCS_BASE: https://docs.f3liz.casa
        run: npm run build

      - name: 配る
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
